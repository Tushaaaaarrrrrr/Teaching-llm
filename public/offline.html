<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Offline Fallback | GenZ IITIAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #161a23;
      --card-bg: rgba(26, 31, 46, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #5266ff;
      --primary-hover: #4053e6;
      --text: #ffffff;
      --text-muted: #8e9bb2;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background lights */
    .glow-sphere {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(82, 102, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      top: 10%;
      left: -50px;
      filter: blur(40px);
      z-index: 1;
      pointer-events: none;
    }

    .glow-sphere-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: 10%;
      right: -50px;
      filter: blur(40px);
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Icon Casing with pulse animation */
    .icon-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(82, 102, 255, 0.1);
      border: 1.5px solid rgba(82, 102, 255, 0.25);
      border-radius: 50%;
      color: var(--primary);
    }

    .icon-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid var(--primary);
      opacity: 0.5;
      animation: pulse 2.4s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 36px;
      padding: 0 12px;
    }

    /* Primary CTA styling with microinteractions */
    .btn {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px rgba(82, 102, 255, 0.3);
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(82, 102, 255, 0.45);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 4px 10px rgba(82, 102, 255, 0.3);
    }

    .btn svg {
      transition: transform 0.3s ease;
    }

    .btn:hover svg {
      transform: rotate(45deg);
    }

    .connection-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #ef4444;
      animation: blink 1.5s infinite;
    }

    /* Animations */
    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.5;
      }
      70% {
        transform: scale(1.4);
        opacity: 0;
      }
      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="glow-sphere"></div>
  <div class="glow-sphere-2"></div>

  <div class="container">
    <div class="icon-wrapper">
      <div class="icon-pulse"></div>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.5"/>
        <path d="M5 12.5a10.94 10.94 0 0 1 5.83-2.84"/>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
        <path d="M21.3 8.11A15.96 15.96 0 0 1 23 9.5"/>
        <path d="M2.7 9.5a15.94 15.94 0 0 1 10.47-3.92"/>
        <path d="M12 20h.01"/>
      </svg>
    </div>

    <h1>You are Offline</h1>
    <p>Please check your internet connection. Your downloaded notes are available in the Downloads section.</p>

    <div style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
      <a href="/downloads" class="btn" style="text-decoration: none; background: #6366f1;">
        Go to Offline Downloads
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </a>

      <button class="btn" id="retryBtn" onclick="retryConnection()" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);">
        Try Reconnecting
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </button>
    </div>

    <div class="connection-status" id="statusText">
      <div class="status-dot"></div>
      Waiting for connection...
    </div>
  </div>

  <script>
    async function checkServer() {
      try {
        const res = await fetch('/api/maintenance-status?_t=' + Date.now(), { cache: 'no-store' });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    async function retryConnection() {
      const btn = document.getElementById('retryBtn');
      const statusText = document.getElementById('statusText');
      btn.innerText = 'Checking...';
      btn.disabled = true;

      const online = await checkServer();
      if (online) {
        window.location.href = '/dashboard';
      } else {
        btn.innerText = 'Try Reconnecting';
        btn.disabled = false;
        if (statusText) {
          statusText.innerHTML = '<span style="color:#ef4444;">⚠️ Still offline. Please check your connection.</span>';
        }
      }
    }

    // Auto-reconnect when device reports it is online
    window.addEventListener('online', async () => {
      const online = await checkServer();
      if (online) {
        window.location.href = '/dashboard';
      }
    });
  </script>
</body>
</html>
